name: Daily eSIM report

on:
  schedule:
    # 09:00 Asia/Seoul = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js (for MCP npx servers)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium (for Playwright MCP)
        run: npx -y playwright@latest install --with-deps chromium

      - name: Prepare application.properties from example
        run: |
          cp src/main/resources/application.properties.example \
             src/main/resources/application.properties

      - name: Restore Gmail MCP OAuth files from secrets
        env:
          GMAIL_GCP_OAUTH_KEYS_JSON: ${{ secrets.GMAIL_GCP_OAUTH_KEYS_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        run: |
          mkdir -p "$HOME/.gmail-mcp"
          if [ -n "$GMAIL_GCP_OAUTH_KEYS_JSON" ]; then
            printf '%s' "$GMAIL_GCP_OAUTH_KEYS_JSON" > "$HOME/.gmail-mcp/gcp-oauth.keys.json"
          else
            echo "Warning: GMAIL_GCP_OAUTH_KEYS_JSON secret is empty"
          fi
          if [ -n "$GMAIL_CREDENTIALS_JSON" ]; then
            printf '%s' "$GMAIL_CREDENTIALS_JSON" > "$HOME/.gmail-mcp/credentials.json"
          else
            echo "Warning: GMAIL_CREDENTIALS_JSON secret is empty"
          fi

      - name: Run daily report (once)
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: mvn -B -q exec:java
