name: Daily eSIM report

on:
  schedule:
    # 09:00 Asia/Seoul = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js (for MCP npx servers)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium (for Playwright MCP)
        run: npx -y playwright@latest install --with-deps chromium

      - name: Prepare application.properties from example
        run: |
          cp src/main/resources/application.properties.example \
             src/main/resources/application.properties

      - name: Run daily report (once)
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
        # compile is required: bare `exec:java` does not build classes on a clean runner
        run: mvn -B -e compile exec:java -Dexec.cleanupDaemonThreads=false
