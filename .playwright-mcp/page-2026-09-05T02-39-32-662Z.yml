    - generic [ref=f297e722]:
      - generic [ref=f297e724]:
        - group "1 / 4" [ref=f297e725]:
          - generic [ref=f297e726]:
            - heading "01" [level=3] [ref=f297e727]
            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f297e728]
            - paragraph [ref=f297e729]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f297e730]:
          - generic [ref=f297e731]:
            - heading "02" [level=3] [ref=f297e732]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f297e733]
            - paragraph [ref=f297e734]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f297e735]:
          - generic [ref=f297e736]:
            - heading "03" [level=3] [ref=f297e737]
            - heading "배송받은 USIM으로 휴대폰을 개통해요" [level=4] [ref=f297e738]
            - paragraph [ref=f297e739]: 신청한 유심을 받으면 통신사와 연락해서 개통을 요청합니다. 간혹 통신사와 연락없이 바로 개통이 될 때도 있어요 개통이 완료되면 유심을 교체해요
        - group "4 / 4" [ref=f297e740]:
          - generic [ref=f297e741]:
            - heading "04" [level=3] [ref=f297e742]
            - heading "ESIM을 지원하는 휴대폰은 편리해요" [level=4] [ref=f297e743]
            - paragraph [ref=f297e744]: ESIM을 선택하면 별도로 배송되지 않고 다운로드할 수 있어요. 이때 개통할 휴대폰은 와이파이에 연결되어 있어야 해요. (기존 통신사는 자동 해지돼요)
