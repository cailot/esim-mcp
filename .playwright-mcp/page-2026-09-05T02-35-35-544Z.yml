                - button "상품 소개" [expanded] [ref=f229e155]
              - region "상품 소개" [ref=f229e156]:
                - paragraph [ref=f229e158]: "[가입 관련 안내] 1. 해당 요금제는 당사 사정에 따라 조기 종료될 수 있습니다. 2. 가입일로부터 90일 이내에 음성 15분 또는 데이터 100MB이상 사용 시 할인혜택이 유지되며, 미사용 시 할인혜택이 적용되지 않을 수 있습니다. 3. 사은품 혜택이 있는 요금제의 경우, 요금제 변경 시에는 혜택 제공이 불가하며 신규가입이나 번호이동 접수 시에 제공됩니다. 4. 이미 아이즈모바일 LGU+망 유심칩을 가지고 계신 고객님께서는 아이즈모바일 홈페이지를 통해서 유심 미구매 가입 신청 부탁드립니다. 5. 신규(새로운 번호를 만드는) 접수의 경우 개통된 유심을 발송드립니다. 유심 수령 후 사용하실 단말기에 장착하여 사용하시기 바랍니다. 6. 번호이동(이전 통신사의 번호 그대로 사용하는) 접수의 경우 유심수령 후 2~3일 이내 자동 개통되므로, 유심칩을 소지하여 주시기 바랍니다. [요금제 기본안내] 1. 해당 요금제의 프로모션할인 혜택은 신규가입, 번호이동 고객에게 적용됩니다. 2. 기존 아이즈모바일 LGU+망 이용고객은 프로모션할인 요금으로 요금제변경이 불가하며, 할인 전 기본요금으로 변경 가능합니다. 3. 프로모션 기간할인은 개통일 기준으로 일할 계산되어 적용됩니다. 예) 7개월 할인 : 1/15 개통 시 1/15 ~ 8/14 할인 적용 4. 월중 가입/해지/변경 시 기본 제공량과 청구금액은 일할 계산되어 적용됩니다. 5. 명의변경, 요금제변경 시 프로모션할인 혜택이 중단되며, 요금제 원복시에 할인 적용이 되지 않습니다. 6. 모든 음성/문자/데이터 기본제공량은 국내 통화에 한해 적용되며, 해외사용은 별도의 로밍요금으로 적용됩니다. 7. 정보이용료(소액결제 등)은 데이터 요금과 별도로 부과됩니다. 8. 개통 시 국제전화 발신차단, 음성로밍차단, 데이터로밍차단 부가서비스가 등록됩니다. 로밍 이용 시에는 해당 부가서비스를 해제하시기 바랍니다. 9. 불법적, 상업적 사용에 따른 피해를 방지하기 위해 서비스가 제한될 수 있습니다. [데이터 사용안내] 기본제공 데이터 소진 후에는 별도 과금 없이 제한된 속도로 제공됩니다. 요금제에 따라 제공되는 속도가 상이합니다. [음성 사용안내] HD Voice 음성통화와 일반통화를 기본 제공하며, 부가통화 및 영상통화는 각 요금제별로 제공합니다. 부가통화 1초 사용 시 부가통화 제공량에서 1초 차감, 영상통화 1초 사용 시 부가통화 제공량에서 1.66초 차감됩니다. 부가통화 제공량 소진 시 부가통화는 1초당 1.98원씩, 영상통화는 1초당 3.3원씩 과금됩니다. ※부가통화란? 전국 대표번호(15XX, 16XX, 18XX 등), 개인번호서비스(050, 060 등), 0130, 011-200, 011-700, 지역번호+153/141/700 등의 전화번호로 하는 통화 [문자 사용안내] 통신망에 관계없이 SMS, LMS, MMS 모두 사용 가능합니다."
