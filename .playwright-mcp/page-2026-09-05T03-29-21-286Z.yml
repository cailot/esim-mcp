              - region "상품 소개" [ref=f220e165]:
                - generic [ref=f220e166]:
                  - paragraph [ref=f220e167]: "[밀리의서재 이용방법] - 밀리의 서재 앱 로그인 및 제휴 구독 활성 후 이용 - 신규 회원 : 밀리의 서재 제휴 혜택 제공 요금제 가입한 휴대폰 번호로 회의 가입 인증시 “KT 알뜰폰 제휴 구독 시작하기” 팝업 노출, 구독 시작하기 버튼 클릭 - 기존 회원 : 회원 가입시 인증한 휴대폰 번호로 이용하는 경우 로그인시에 “KT 알뜰폰 제휴 구독 시작하기” 팝업 자동으로 노출, 구독 시작하기 버튼 클릭 - 기존 구독 서비스 및 상태에 따라 일부 사용자는 구독 이용이 불가능할 수 있음. 기업회원, 종이책 정기구독 회원, 인앱결제 회원, 전환 예약 회원, 타제휴/혜택 상품 이용 회원 등 [유의사항] 1. 기본료(기간할인금액, 평생할인금액 등)와 제공 사은품은 개통시점 기준으로 적용됩니다. 2. 정보이용료(소액결제 등)는 데이터 요금과 별도로 부과됩니다. 3. 중도가입/해지시 기본량과 청구 금액은 일할 계산되어 적용됩니다. 4. 최소 유지기간이 있으며, 최소 유지기간 내 해지시 할인반환금이 발생합니다. 1) 최소 유지기간 : 개통월 포함 4개월 이며, 개통월을 1개월 차로 산정합니다. 예) 9월 1일 개통 시 12월 31일까지 유지, 9월 30일 개통 시 12월 31일까지 유지 2) 할인반환금 산정 방식 : 유지 기간 내 할인 받은 총 금액 5. 요금할인은 일할 적용됩니다. 6. 택배수령 유심의 경우 개통 조건으로 무료 제공되며, 미개통 및 단순 변심으로 인한 취소 시 비용이 발생됩니다. 7. 기존 아시아모바일 고객님의 요금제 변경 시에는 프로모션(요금할인)이 적용되지 않은 금액으로 변경 됩니다. [데이터 제공 안내] 1. 기본 제공량 초과 시 Qos 속도제어 되어 기본 제공되며, 별도 요금은 부과되지 않습니다. (Qos속도는 사용환경, 디바이스 등에 따라 달라질 수 있습니다.) 2. \"olleh Wi-Fi\"가 기본 제공됩니다. 3. 데이터 테더링은 요금제별 제공되는 월 제공량 내에서 사용 가능하며 소진 시 최대 200Kbps 속도로 지속 이용 가능합니다. - 월 제공량 40GB 4. mVoIP은 요금제별 기본 제공 데이터 통화 제공량 내에서 이용 가능하며 소진 시 차단됩니다."
