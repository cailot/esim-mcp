            - paragraph [ref=f125e715]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f125e716]:
          - generic [ref=f125e717]:
            - heading "02" [level=3] [ref=f125e718]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f125e719]
            - paragraph [ref=f125e720]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f125e721]:
