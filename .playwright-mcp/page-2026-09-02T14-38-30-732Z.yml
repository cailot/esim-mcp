              - list [ref=f259e750]:
                - listitem [ref=f259e751]: 등기우편물을 발송한 후 그 우편물에 대한 배달여부를 우체국에서 공적으로 증명 받기 위하여 신청하는 서비스입니다.
                - listitem [ref=f259e752]: 우체국을 방문하지 않고 인터넷으로 조회하여 프린터로 직접 인쇄하는 서비스입니다.
