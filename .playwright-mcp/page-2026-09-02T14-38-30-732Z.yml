                - listitem [ref=f259e754]: "신청기간: 배달완료일 D+2일부터 신청가능. 등기통상을 발송한 다음날부터 1년 이내(단, 내용증명은 3년 이내)"
                - listitem [ref=f259e755]:
                  - text: "이용요금 :"
                  - generic [ref=f259e756]: 1건당 1,600원
                - listitem [ref=f259e757]:
                  - text: 이 서비스는 인터넷우체국 회원만 신청 가능합니다.
                  - link "회원가입" [ref=f259e758] [cursor=pointer]:
