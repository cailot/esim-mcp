                - listitem [ref=f259e759]: 본 서비스는 결제 후 다음날 24시까지 (재)출력이 가능합니다.
                - listitem [ref=f259e760]:
                  - generic [ref=f259e761]: "국가정보자원관리원 화재(2025.9.26.)로 인해 인터넷우체국에서는 특정 기간(2025.6.22.~ 9.26.)에 접수한 우편물의 재증명 서비스가 불가합니다. 우체국 창구에서는 재증명 서비스가 가능하오니 가까운 우체국을 방문하여 주시기 바랍니다. 방문 시 반드시 신분증을 지참하시고 대리인이 신청하는 경우에는 아래 서류를 준비하여 방문하시기 바랍니다(소요기간: 2~3일) *(일반) 위임장, 위임인의 본인서명사실확인서, 대리인 신분증, (법인) 대표자의 위임장, 법인인감증명서, 대리인 신분증"
                  - paragraph [ref=f259e762]: "- 본인서명사실확인서는 인감증명서(본인발급, 대리발급)로 대체 가능"
