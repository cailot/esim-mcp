                      - paragraph [ref=f150e170]: 음성 제공 안내
                  - definition [ref=f150e172]:
                    - paragraph [ref=f150e173]: "- 기본 제공량은 음성 1초당 1초, 영상 1초당 1.66초 기준으로 기본 제공량에서 줄어듭니다."
                    - paragraph [ref=f150e174]: "- 기본 제공 통화는 국내 통화에 한하여 제공되며, 미소진 잔여량은 이월되지 않습니다."
                    - paragraph [ref=f150e175]: 또한, 월 단위로 제공되므로 월 중 요금제 가입/변경/해지 시 요금제 사용일만큼 일할 계산되어 제공됩니다.
                    - paragraph [ref=f150e176]: "- 음성 및 영상 통화는 통화 시작 시간 기준으로 과금됩니다."
                    - paragraph [ref=f150e177]: (월말 시작하여 익월 종료된 통화는 시작 월에 과금됩니다.)
                    - paragraph [ref=f150e178]: "- 부가통화 이용시 부가통화 사업자가 정하는 바에 따라 별도의 정보이용료가 발생될 수 있습니다."
