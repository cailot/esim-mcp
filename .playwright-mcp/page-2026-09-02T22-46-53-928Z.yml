          - list [ref=f302e954]:
            - listitem [ref=f302e955]: 중량은 최대 30kg 이하이며, 크기(가로, 세로, 높이의 합)는 최소 35㎝ 이상, 최대 160㎝ 이하입니다. 다만, 한 변의 최대 길이는 100㎝ 이내에 한하여 취급합니다.
