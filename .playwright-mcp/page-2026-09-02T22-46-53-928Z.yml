            - listitem [ref=f302e957]: 중량/크기 중 큰 값을 기준으로 다음 단계의 요금을 적용합니다.
            - listitem [ref=f302e958]: 도서지역 등 특정지역의 배달 소요기간은 위 내용과 다를 수 있습니다.
            - listitem [ref=f302e959]: 제주지역 제주행(육지→제주)은 D+2일 배달, 제주발(제주→육지)은 우체국별 접수 마감시간에 따라 익일배달 또는 D+2일 배달 되고 있습니다.
