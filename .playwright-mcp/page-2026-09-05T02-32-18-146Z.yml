                - paragraph [ref=f183e159]: "■ 네이버페이 5천원 프로모션 요금제 ■ - 기 간 : ‘26. 9. 1 ~ ‘26. 9. 30( 이벤트 기간은 당사의 사정에 따라 연장 및 조기 종료될 수 있습니다) - 지급대상 : ‘26. 9. 1 ~ ‘26. 9. 30 기간 내 대상 요금제 접수 및 9월 내 개통 완료 고객 - 지 급 일 : M+4개월 말일(26년 9월 가입 시 27년 1월 말일 지급) - (선택) 개인정보 제3자 제공 및 마케팅 활용에 동의하셔야 사은품 등 혜택을 받으실 수 있습니다. ▶유심사 3일 500MB 쿠폰 발송◀ 혜택 제공 대상 *자세한 내용은 에이모바일 이벤트 페이지를 참고 부탁드립니다. - 유심사 3일 500MB 쿠폰: 마케팅 수신 동의 고객에 한해 개통하신 휴대폰 번호로 매주 첫 영업일에 문자로 안내가 발송됩니다. ■ 혜택 제공 안내 - 경품/사은품의 유효기간 연장은 불가하며, 유효기간 만료/초과 건에 대해서는 당사가 책임지지 않습니다. (재발송 또한 불가합니다.) - 경품/사은품 제공 이전에 해지, 이용정지, 명의변경, 요금제 변경 등 변동사항 발생 시 경품/사은품 지급에서 제외됩니다. - 해당 경품/사은품 제공 및 요금할인 등의 프로모션은 신규, 번호이동 고객만 적용됩니다. - 가입 또는 신청서 작성 시 약관 동의 단계에서 선택 약관\"(선택)개인정보 제3자 제공 및 마케팅 활용 동의\"에 동의하셔야 경품/사은품 등 혜택을 받으실 수 있습니다. ■ 상품 가입 및 해지안내 - 가입(1) : 요금 할인 및 경품 제공 프로모션은 자사 다이렉트몰(에이모바일 홈페이지) 및 제휴 사이트를 통해 해당 이벤트 기간 내 신규가입 또는 번호이동 신청부터 개통까지 모두 완료하신 고객을 대상으로 할인 적용 및 경품이 제공됩니다(유심배송 여부와 관계 없이 기간 내 신청/개통이 완료되어야 합니다). - 가입(2) : 프로모션 종료 안내는 별도로 고지되지 않으며, 프로모션 내용은 당사 사정에 의해 변경될 수 있고, 이에 따르는 혜택 미제공은 당사가 책임지지 않습니다. - 일할 계산 : 모든 요금제의 무료 제공량은 매월 1일 개통 기준이며 중도 개통한 고객님께는 개통일 기준으로 일할 계산되어 제공됩니다. - 요금 할인 : SK, KT 1월15일 7개월 할인 요금제 개통 시 개통일 기준 만 7개월(8월14일)간 할인 적용 / LG 1월15일 7개월 할인 요금제 개통 시 개통월 포함 7개월(7월31일)간 할인 적용 - 해지/요금제 변경 : 기본료 및 통화, 문자, 데이터 등 기본 제공량이 일할 계산되어 청구되어 초과요금이 발생할 수 있으며, 요금할인은 중단됩니다. - 국제전화, KT114 직접연결수수료 및 통화료, KT114 전화번호 안내 서비스, 수신자 부담(콜렉트콜), 소액결제 이용료, 060 등 정보 이용료, 유료 부가서비스 월 이용료 등은 별도로 청구됩니다. ※※※ 요금제별 상품 가입에 대한 안내 사항 확인을 위해 A모바일 홈페이지(https://amobile.co.kr/)에서 해당 요금제 상세 페이지를 꼭 확인해주시길 바라며, 가입 시 동의하실 약관의 내용을 필히 정독해주시길 바랍니다 ※※※"
