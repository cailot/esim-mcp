    - generic [ref=f127e718]:
      - generic [ref=f127e720]:
        - group "1 / 4" [ref=f127e721]:
          - generic [ref=f127e722]:
            - heading "01" [level=3] [ref=f127e723]
            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f127e724]
            - paragraph [ref=f127e725]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f127e726]:
          - generic [ref=f127e727]:
            - heading "02" [level=3] [ref=f127e728]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f127e729]
            - paragraph [ref=f127e730]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f127e731]:
