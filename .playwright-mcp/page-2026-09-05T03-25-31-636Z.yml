            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f162e724]
            - paragraph [ref=f162e725]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f162e726]:
          - generic [ref=f162e727]:
            - heading "02" [level=3] [ref=f162e728]
