    - heading "알뜰폰 온라인 개통은 이렇게 진행돼요" [level=2] [ref=f171e742]
    - generic [ref=f171e747]:
      - generic [ref=f171e749]:
        - group "1 / 4" [ref=f171e750]:
          - generic [ref=f171e751]:
            - heading "01" [level=3] [ref=f171e752]
            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f171e753]
            - paragraph [ref=f171e754]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f171e755]:
          - generic [ref=f171e756]:
            - heading "02" [level=3] [ref=f171e757]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f171e758]
            - paragraph [ref=f171e759]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f171e760]:
          - generic [ref=f171e761]:
            - heading "03" [level=3] [ref=f171e762]
            - heading "배송받은 USIM으로 휴대폰을 개통해요" [level=4] [ref=f171e763]
            - paragraph [ref=f171e764]: 신청한 유심을 받으면 통신사와 연락해서 개통을 요청합니다. 간혹 통신사와 연락없이 바로 개통이 될 때도 있어요 개통이 완료되면 유심을 교체해요
        - group "4 / 4" [ref=f171e765]:
