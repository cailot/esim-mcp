            - heading "04" [level=3] [ref=f171e767]
            - heading "ESIM을 지원하는 휴대폰은 편리해요" [level=4] [ref=f171e768]
            - paragraph [ref=f171e769]: ESIM을 선택하면 별도로 배송되지 않고 다운로드할 수 있어요. 이때 개통할 휴대폰은 와이파이에 연결되어 있어야 해요. (기존 통신사는 자동 해지돼요)
