              - region "상품 소개" [ref=f235e172]:
                - paragraph [ref=f235e174]: "- 알뜰폰 허브 사이트로 가입 신청 시 유심비는 월 청구 금액에 포함되어 후청구 됩니다. (유심비는 1회) [테더링(핫스팟) 이용 안내] * 해당 요금제의 테더링(핫스팟) 이용 한도는 월 30GB 내에서 이용 가능 합니다. [음성 '기본제공' 혜택의 범위] 상업적 목적이 아닌 일반 가입자간 통화 목적의 국내 음성통화(HD Voice 음성통화 포함)로서, 최초 수신번호가 이동전화(식별번호: 010, 011, 016, 017, 018, 019), 17개 대역별 유선전화(지역번호: 02, 03X, 04X, 05X 등), 인터넷전화(070) 및 특수번호(1335, 120, 122 등)인 통화에 한합니다. [음성 '기본제공' 혜택 제한기준] ⓐ 일 음성 통화량이 600분을 초과하는 횟수가 월 3회를 넘는 경우 ⓑ 당월 총 음성 통화량이 (SKT망 : 10,000분 & KT/LG U+망 : 6,000분)을 초과하는 경우 ⓒ TM/ 폰팅 등과 같이 음성통화를 광고 · 상업적 목적으로 이용하는 경우 (수신처가 월 1,000개 회선을 초과하는 경우에는 광고 · 상업적 목적으로 이용하는 것으로 간주합니다.) [문자 '기본제공' 혜택 제한기준] - SMS, MMS(텍스트형, 멀티미디어형) 포함 ⓐ 일 SMS & MMS 사용량이 (SKT망 : 500건 / KT망 : 500건 / LG망 : 500건)을 초과하는 경우 ⓑ 일 SMS & MMS 사용량이 (SKT : 200건 & KT/LG U+망 : 150건)을 초과하는 횟수가 월 중 10회를 넘는 경우 ⓒ 광고성 스팸 메시지 발송과 같이 상업적 목적으로 이용하거나 물리적 장치 또는 자동발송 프로그램을 이용하는 경우 (수신처가 (SKT망 : 월 3,000개 & KT/LG U+망 : 월 2,000개) 회선을 초과하는 경우) ※ 기본제공되는 문자 미소진시, 잔여량은 이월되지 않습니다. [가입 관련 안내] 1. 해당 요금제는 당사 사정에 따라 조기 종료될 수 있습니다. 2. 가입 월로부터 M+3개월 내에 음성 15분, 데이터 50MB 미만 사용 회선은 할인 중단 및 직권 해지 될 수 있습니다. 3. 사은품 혜택이 있는 요금제의 경우, 요금제 변경 시에는 혜택 제공이 불가하며 신규가입이나 번호이동 접수 시에 제공됩니다. [음성 사용안내] mVoip는 요금제 기본제공량 내에서만 사용가능합니다. - 기본 제공량은 음성 1초당 1초, 영상 1초당 1.66초 기준으로 기본 제공량에서 줄어듭니다. - 기본제공되는 통화 미소진시, 잔여량은 이월되지 않습니다. **부가통화란? 전국 대표번호(15XX, 16XX, 18XX 등), 개인번호서비스(050, 060 등), 0130, 011-200, 011-700, 지역번호+153/141/700 등의 전화번호로 하는 통화 [문자 사용안내] 기본제공량 소진 시에는 기준요율에 따라 과금됩니다. SMS (한글 40자 이하 단문메시지) : 22원/건 LMS (한글 1천자 이하 장문메시지) : 33원/건 MMS 이미지 : 110원/건 MMS 동영상 : 110원/건"
