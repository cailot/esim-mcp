              - link "서비스안내" [ref=f251e816] [cursor=pointer]:
                - /url: "#"
              - generic [ref=f251e817]:
                - generic [ref=f251e819]:
                  - heading "이용안내" [level=5] [ref=f251e820]
                  - list [ref=f251e821]:
                    - listitem [ref=f251e822]: 동문내용증명 접수는 우체국창구를 이용해 주시기 바랍니다.
                    - listitem [ref=f251e823]: "편지병합(메일머지)을 이용하는 내용증명 : 받는 분 2명부터 이용 가능, 내용문서는 150매로 제한 ※ 150매 제한 : 내용문, 보내는 분·받는 분 주소·성명, 내용증명인과 전자소인을 포함한 매수 ※ 우편물 봉투 크기 : 소형봉투 제작(내용문 1매~6매), 대형봉투 제작(내용문 7매~150매)"
                    - listitem [ref=f251e824]: "문서 작성 여백 기준(A4 세로) : 최소 상20mm, 하40mm, 좌15mm, 우15mm 이상"
                    - listitem [ref=f251e825]:
                      - text: 문서 편집기 프로그램 이용 시 유의사항
                      - list [ref=f251e826]:
                        - listitem [ref=f251e827]: "[문서 첨부하기] 가능한 문서파일 : pdf, hwp, doc, docx, ppt, pptx, xls, xlsx"
                      - list [ref=f251e828]:
                        - listitem [ref=f251e829]: "문서첨부 가능 버전 : 한컴오피스(2010, 2014), MS오피스(2007, 2010, 2013)"
                      - list [ref=f251e830]:
                        - listitem [ref=f251e831]: 문서파일 상·하단에 쪽번호, 꼬리말 등이 추가되면 파일 업로드가 불가능합니다.
                      - list [ref=f251e832]:
                        - listitem [ref=f251e833]: 망분리(클라우드) 환경에서는 편집기 사용이 어려울 수 있습니다.
                      - list [ref=f251e834]:
                        - listitem [ref=f251e835]: 편집기 미지원 사항으로 인터넷 접수가 어려운 경우, 우체국창구 내용증명을 이용 바랍니다.
                    - listitem [ref=f251e836]: 제공되는 편집기에서 직접 문서를 작성하거나, 화면하단의 '내용증명 양식 다운로드'에서 샘플파일을 다운로드 받아 편집한 후, 편집기에 업로드하여 문서 작성이 가능합니다. (단, 업로드한 내용은 편집기에서 수정 불가)
                - generic [ref=f251e838]:
                  - list [ref=f251e839]:
                    - listitem [ref=f251e840]: 내용증명 접수 후 1시간 이내에만 취소 가능(1시간 경과시 우체국창구에서 반환청구만 가능)
                    - listitem [ref=f251e841]: 우편물 반환청구는 가까운 우체국에서 가능합니다.(인터넷우체국에서는 반환청구 불가)
                    - listitem [ref=f251e842]:
                      - text: 접수한 내용증명의 등본파일 출력, 저장 및 발송 후 내용증명은 반환청구 기간이 경과한 이후(최종적으로 우편물이 배달되거나 미배달(반송) 처리된 시점 이후)부터 가능합니다.
                      - list [ref=f251e843]:
                        - listitem [ref=f251e844]: 배송조회 시 배달결과에 ‘미배달’로 조회되는 우편물 중 ‘배달예정’, ‘보관중’인 우편물은 최종적으로 배달완료 또는 미배달 처리된 우편물이 아니므로 등본파일 출력, 저장 및 발송 후 내용증명 신청은 불가합니다.
                      - list [ref=f251e845]:
                        - listitem [ref=f251e846]: 최종적으로 처리되기 전까지는 [나의내용증명] 화면에서 미리보기만 가능합니다.
                    - listitem [ref=f251e847]:
                      - text: 접수한 내용증명의 등본을 우편물로 수령을 원하시면 ‘발송 후 내용증명’ 화면에서 신청할 수 있습니다.
