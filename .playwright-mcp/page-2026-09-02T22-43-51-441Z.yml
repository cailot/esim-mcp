    - heading "알뜰폰 온라인 개통은 이렇게 진행돼요" [level=2] [ref=f138e695]
    - generic [ref=f138e700]:
      - generic [ref=f138e702]:
        - group "1 / 4" [ref=f138e703]:
          - generic [ref=f138e704]:
            - heading "01" [level=3] [ref=f138e705]
            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f138e706]
            - paragraph [ref=f138e707]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f138e708]:
          - generic [ref=f138e709]:
            - heading "02" [level=3] [ref=f138e710]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f138e711]
            - paragraph [ref=f138e712]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f138e713]:
          - generic [ref=f138e714]:
            - heading "03" [level=3] [ref=f138e715]
            - heading "배송받은 USIM으로 휴대폰을 개통해요" [level=4] [ref=f138e716]
            - paragraph [ref=f138e717]: 신청한 유심을 받으면 통신사와 연락해서 개통을 요청합니다. 간혹 통신사와 연락없이 바로 개통이 될 때도 있어요 개통이 완료되면 유심을 교체해요
        - group "4 / 4" [ref=f138e718]:
