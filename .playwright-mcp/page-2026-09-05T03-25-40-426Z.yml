                      - paragraph [ref=f166e166]: 기본 안내
                  - definition [ref=f166e168]:
                    - paragraph [ref=f166e169]: "- 해당 요금상품은 신규/번호이동 고객만 가입 가능하며, 기존 프리티U+고객은 해당 상품으로 요금변경이 불가 합니다."
                    - paragraph [ref=f166e170]: "- 프리티의 모든 요금제는 위약금이 없는 무약정 요금제 입니다."
                    - paragraph [ref=f166e171]: "- 온라인몰에서만 가입 가능한 전용 요금제이며, 프리티의 모든 요금제 기본료는 부가세가 포함된 금액입니다."
                    - paragraph [ref=f166e172]: "- 프리티의 모든 요금제는 발신번호표시서비스(CID)를 기본으로 제공합니다."
                    - paragraph [ref=f166e173]: "- 통화품질, 부가서비스는 LGU+와 동일합니다."
                    - paragraph [ref=f166e174]: "- 월 중 요금제 가입/해지/변경 시, 기본 제공량 및 기본료는 일할 계산되어 적용됩니다."
                    - paragraph [ref=f166e175]: (기본 제공량은 국내 사용량에만 해당됩니다.)
                    - text: "- 추가 기간할인 혜택이 있는 경우, 할인 혜택 적용은 개통 당일부터 지정기간 동안 할인 적용(일할 계산)됩니다."
                    - paragraph [ref=f166e176]: "- 해외에서 온라인으로 신청하신 고객은 연락 가능한 번호가 없으면 가입 진행이 불가합니다."
                    - paragraph [ref=f166e177]: (현지 전화번호의 국제전화로는 통화불가, 국내 사용 중인 로밍번호로 가능)
                    - paragraph [ref=f166e178]: "- 요금제 변경(원복 포함)/명의변경 시 할인 적용이 중단되며 일시정지 시에도 할인이 중단되나 정지기간은 할인 기간에 포함 됩니다."
              - listitem [ref=f166e179]:
                - generic [ref=f166e180]:
                  - term [ref=f166e181]:
                    - link [ref=f166e182] [cursor=pointer]:
                      - /url: javascript:void(0)
                      - paragraph [ref=f166e183]: 음성 제공 안내
                  - definition [ref=f166e185]:
                    - paragraph [ref=f166e186]: "- 기본 제공량은 음성 1초당 1초, 영상 1초당 1.66초 기준으로 기본 제공량에서 줄어듭니다."
                    - paragraph [ref=f166e187]: "- 기본 제공 통화는 국내 통화에 한하여 제공되며, 미소진 잔여량은 이월되지 않습니다."
                    - paragraph [ref=f166e188]: 또한, 월 단위로 제공되므로 월 중 요금제 가입/변경/해지 시 요금제 사용일만큼 일할 계산되어 제공됩니다.
                    - paragraph [ref=f166e189]: "- 음성 및 영상 통화는 통화 시작 시간 기준으로 과금됩니다."
                    - paragraph [ref=f166e190]: (월말 시작하여 익월 종료된 통화는 시작 월에 과금됩니다.)
                    - paragraph [ref=f166e191]: "- 부가통화 이용시 부가통화 사업자가 정하는 바에 따라 별도의 정보이용료가 발생될 수 있습니다."
