                    - paragraph [ref=f131e200]: "- 기본제공 메시지는 SMS, MMS를 개당 1건씩 제공량 내에서 차감하여 이용 가능합니다."
                    - paragraph [ref=f131e201]: (단, 본문과 첨부파일을 같이 발신하는 MMS는 2건 차감)
                    - paragraph [ref=f131e202]: "- 기본제공 메시지 초과 시 요금은 이용한 건수를 기준으로 아래와 같이 과금 및 차감됩니다."
