    - generic [ref=f305e718]:
      - generic [ref=f305e720]:
        - group "1 / 4" [ref=f305e721]:
          - generic [ref=f305e722]:
            - heading "01" [level=3] [ref=f305e723]
            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f305e724]
            - paragraph [ref=f305e725]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f305e726]:
          - generic [ref=f305e727]:
            - heading "02" [level=3] [ref=f305e728]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f305e729]
            - paragraph [ref=f305e730]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f305e731]:
          - generic [ref=f305e732]:
            - heading "03" [level=3] [ref=f305e733]
            - heading "배송받은 USIM으로 휴대폰을 개통해요" [level=4] [ref=f305e734]
            - paragraph [ref=f305e735]: 신청한 유심을 받으면 통신사와 연락해서 개통을 요청합니다. 간혹 통신사와 연락없이 바로 개통이 될 때도 있어요 개통이 완료되면 유심을 교체해요
