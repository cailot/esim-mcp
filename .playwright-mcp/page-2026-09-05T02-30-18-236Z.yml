    - generic [ref=f163e708]:
      - generic [ref=f163e710]:
        - group "1 / 4" [ref=f163e711]:
          - generic [ref=f163e712]:
            - heading "01" [level=3] [ref=f163e713]
            - heading "요금제를 선택하고 가입신청서를 작성하세요" [level=4] [ref=f163e714]
            - paragraph [ref=f163e715]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f163e716]:
          - generic [ref=f163e717]:
            - heading "02" [level=3] [ref=f163e718]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f163e719]
            - paragraph [ref=f163e720]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
        - group "3 / 4" [ref=f163e721]:
          - generic [ref=f163e722]:
            - heading "03" [level=3] [ref=f163e723]
            - heading "배송받은 USIM으로 휴대폰을 개통해요" [level=4] [ref=f163e724]
            - paragraph [ref=f163e725]: 신청한 유심을 받으면 통신사와 연락해서 개통을 요청합니다. 간혹 통신사와 연락없이 바로 개통이 될 때도 있어요 개통이 완료되면 유심을 교체해요
