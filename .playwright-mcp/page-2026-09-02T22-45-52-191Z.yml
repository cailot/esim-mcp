                    - listitem [ref=f235e852]: "익일특급 : 접수한 다음날 배달 (14시 이전 결제 분에 한함) ※ 제주 전 지역 익일특급 배달일 D+2일로 조정 (시행일 : '20. 2. 3.) ※ 14시 이후 결제 분은 하루가 더 소요됩니다. ※ 익일특급은 1회 최대 100통 까지 접수 가능합니다."
