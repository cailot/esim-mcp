            - paragraph [ref=f144e715]: 원하는 요금제를 선택 후 신청 버튼을 클릭하여 가입 신청서를 작성합니다. 가입 신청서를 작성해도 기존 통신사는 바로 해지되지 않아요
        - group "2 / 4" [ref=f144e716]:
