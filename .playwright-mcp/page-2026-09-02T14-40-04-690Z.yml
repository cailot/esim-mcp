        - generic [ref=f339e739]:
          - link "국제특급(EMS)" [ref=f339e741] [cursor=pointer]:
            - /url: /front.Introduction01.postal
          - generic [ref=f339e742]:
            - list [ref=f339e745]:
              - listitem [ref=f339e746]: EMS란 급한 편지, 서류나 소포 등을 가장 빠르고 안전하게 외국으로 배달해 주는 국제특급우편으로 우정사업본부가 외국의 공신력 있는 우편당국과 체결한 특별협정에 따라 취급합니다.
            - generic [ref=f339e747]:
              - heading "특성" [level=4] [ref=f339e749]
              - generic [ref=f339e750]:
                - heading "공신력" [level=5] [ref=f339e751]
                - definition [ref=f339e752]:
                  - list [ref=f339e753]:
                    - listitem [ref=f339e754]: 급한 편지, 서류나 소포 등을 가장 빠르고 안전하게 외국으로 배달해 주는 국제우편 서비스로서 국가기관인 우정사업본부가 공신력있는 외국 우편당국과 체결한 특별협정에 따라 취급합니다.
                - heading "신속성" [level=5] [ref=f339e755]
                - definition [ref=f339e756]:
                  - list [ref=f339e757]:
                    - listitem [ref=f339e758]: 서울에서 오전에 부치시면 도착국가에서 통관검사를 거칠 필요가 없는 우편물(서류)의 경우 동경, 홍콩, 싱가폴 등 가까운 곳은 2~3일, 기타 국가는 3~5일 이내에 배달됩니다.
                - heading "조회가능" [level=5] [ref=f339e759]
                - definition [ref=f339e760]:
                  - list [ref=f339e761]:
                    - listitem [ref=f339e762]: 미국, 일본, 영국, 홍콩 등 주요국가 59개국(계속 확대중)으로 발송한 국제특급우편물의 경우에는 국제적으로 연결된 컴퓨터망을 통하여 배달 여부가 즉시 조회 가능합니다. 컴퓨터 조회가 되지 않을 경우에도 이용자가 원하시면 팩시밀리나 이메일을 통하여 신속하게 조회하고 그 결과를 알려드립니다.
                - heading "EMS 행방조회" [level=5] [ref=f339e763]
                - definition [ref=f339e764]:
                  - list [ref=f339e765]:
                    - listitem [ref=f339e766]:
                      - link "https://www.epost.go.kr" [ref=f339e767] [cursor=pointer]:
                        - /url: http://www.epost.go.kr
                      - text: 또는
                      - link "https://www.koreapost.go.kr" [ref=f339e768] [cursor=pointer]:
                        - /url: http://www.koreapost.go.kr
            - generic [ref=f339e769]:
              - heading "종류" [level=4] [ref=f339e771]
              - generic [ref=f339e772]:
                - heading "EMS (Express Mail Service)" [level=5] [ref=f339e773]
                - definition [ref=f339e774]:
                  - list [ref=f339e775]:
                    - listitem [ref=f339e776]: EMS는 전세계 우체국 간에 특별 우편운송망을 통해 가장 빠르고 안전하게 우편물을 배달하는 특급우편서비스입니다.
                - heading [level=5] [ref=f339e777]:
                  - text: 초특급우편서비스 (EMS Time Certain Service)
                  - link "초특급우편대상지역" [ref=f339e778] [cursor=pointer]:
                    - /url: "#"
                - definition [ref=f339e779]:
                  - list [ref=f339e780]:
                    - listitem [ref=f339e781]: 홍콩, 일본 등 일부국가에 대하여 발송 다음날 09:00에서 17:00까지 배달하는 초특급 국제우편서비스입니다.
            - generic [ref=f339e782]:
              - heading "취급국가" [level=4] [ref=f339e784]
              - paragraph [ref=f339e785]: 홍콩, 일본과 1979년 7월 1일 업무개시 이후 계속 취급국가가 확대되고 있습니다. 2020. 12월 현재 101개국으로 EMS 발송이 가능합니다. (나머지 72개 국가는「EMS프리미엄」으로 발송가능)
            - generic [ref=f339e786]:
              - heading "특수취급의 종류" [level=4] [ref=f339e788]
              - paragraph [ref=f339e789]: 국제특급우편물의 특수취급의 종류는 다음과 같습니다.
              - list [ref=f339e790]:
                - listitem [ref=f339e791]: 배달통지
                - listitem [ref=f339e792]: 보험취급
            - generic [ref=f339e793]:
              - heading "배달소요일수" [level=4] [ref=f339e795]
              - paragraph [ref=f339e796]: 통관이 필요하지 않는 서류(우편물 접수번호가 EE로 시작됨)의 경우에 한해서만 서울지역에서 (일부지역 제외) 오전 12시까지 접수하면 직항편이 있는 도시지역 (도쿄, 홍콩, 싱가포르 등)에는 다음날 또는 3~4일내에 배달되며 기타지역과 국가에는 4~6일 이내에 배달됩니다.
              - heading "다음의 경우는 1일이 추가소요됩니다." [level=6] [ref=f339e797]
              - list [ref=f339e798]:
                - listitem [ref=f339e799]: 서울지역에서 12시 이후 접수한 것
                - listitem [ref=f339e800]: 서울지역 이외의 지방에서 접수한 것
                - listitem [ref=f339e801]: 배달지가 도착국가의 교환우체국 소재지 이외 지역인 경우
                - listitem [ref=f339e802]: 산간 또는 도서벽지 소재지 우체국에서 접수된 우편물은 국제우편물류센터까지의 도착소요일수가 추가됩니다.
                - listitem [ref=f339e803]: 도착국가에서 통관이 필요한 품목(우편물 접수번호가EM으로 시작됨)은 세관검사에 소요되는 기간만큼이 추가됩니다.
            - generic [ref=f339e804]:
              - heading "주소기표지 및 첨부서류" [level=4] [ref=f339e806]
              - list [ref=f339e807]:
                - listitem [ref=f339e808]: 업무용 서류 또는 인쇄물에는 "세관표지(CN22)"가 인쇄된 서류용 주소기표지를 사용하여야 합니다.
                - listitem [ref=f339e809]: 상품과 유가물품에는 "세관신고서(CN23)"가 인쇄된 상품용 주소기표지를 사용하여야 합니다.
                - listitem [ref=f339e810]:
                  - text: 상업목적의 수출·입 물품에는 세관공무원이 참고할 수 있도록 다음 서류를 봉투에 넣어 우편물 표면에 첨부하여야 통관이 쉽게 이루어집니다.
                  - paragraph [ref=f339e811]: • 상업송장(당해 회사명과 주소가 인쇄된 서식에 내용품과 가격을 기재한 것)
                  - paragraph [ref=f339e812]: • 무역관련서류(수출입허가서, 검역증명서, 원산지증명서 등)
              - list [ref=f339e813]:
                - listitem [ref=f339e814]: 자세한 사항은 국번없이 1588-1300 으로 문의 바랍니다.
