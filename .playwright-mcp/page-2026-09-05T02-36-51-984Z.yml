                - paragraph [ref=f252e163]: ＊기간 할인 프로모션이 적용되는 상품으로 요금제로 할인 종료 후에는 정상 기본료가 청구됩니다. ＊2026년 7월 1일 이후 접수시 할인은 월 단위 할인으로 적용됩니다.(ex 1/20일 개통 > 7개월 할인시 7/30까지 할인) ＊찬스모바일 사용 중인 가입자는 요금제 변경 시 프로모션 요금제로 변경이 불가합니다. ＊부가통화 및 테더링,핫스팟제공량은 가입신청 전 확인해 주시기바랍니다. ＊개통일 기준 93일 이내 해지/정지는 불가하며, 미 유지 시 할인 반환금이 청구됩니다. ＊개통 후 명의변경/일시정지/요금제 변경 시 프로모션 할인은 적용되지 않습니다. ＊테더링,핫스팟사용은 월 데이터 제공량에서 같이 사용되며 월 4.5GB입니다. 가입달은 일할계산되어 적용됩니다.
