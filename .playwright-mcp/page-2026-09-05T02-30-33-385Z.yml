            - heading "배송받은 USIM으로 휴대폰을 개통해요" [level=4] [ref=f175e763]
            - paragraph [ref=f175e764]: 신청한 유심을 받으면 통신사와 연락해서 개통을 요청합니다. 간혹 통신사와 연락없이 바로 개통이 될 때도 있어요 개통이 완료되면 유심을 교체해요
