            - heading "02" [level=3] [ref=f339e757]
            - heading "통신사에서 USIM을 배송받아요" [level=4] [ref=f339e758]
            - paragraph [ref=f339e759]: 가입 신청서를 작성하면 해당 통신사에서 해피콜이 와요. 해당 통신사에서 유심과 휴대폰이 호환되는지 확인하고 유심을 발송합니다.
