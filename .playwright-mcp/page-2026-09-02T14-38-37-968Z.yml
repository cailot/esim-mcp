              - heading "무인우체국이란?" [level=5] [ref=f272e754]
              - list [ref=f272e755]:
                - listitem [ref=f272e756]: 현재 고객이 우체국 창구를 통하지 않고 무인우체국에서 직접 우편물을 접수, 수령을 쉽게 처리 할 수 있는 고객의 시스템입니다.
                - listitem [ref=f272e757]: 우체국 고객편익 증진을 위해 공휴일 및 영업시간 외에도 우편서비스를 이용하실 수 있습니다.
                - listitem [ref=f272e758]: "무인우체국 운영 : 하남(하남아이테크), 성남분당(오리역전) ※ 2020년 11월 폐기된 무인우체국 : 서울 송파(가락시장 신청사), 관악(서울관악우체국), 일산(고양일산우체국), 경남 창원(창원대학교 학생관), 세종(도담동 복합커뮤니티센터), 충북 서청주(서원대학교 기숙사), 김천 조달센터 부스 ※ 2022년 11월 폐기된 무인우체국 : 경기 김포(김포이젠)"
            - generic [ref=f272e760]:
              - heading "무인우체국 제공 서비스" [level=5] [ref=f272e762]
              - list [ref=f272e763]:
                - listitem [ref=f272e764]:
                  - text: "접수 : 일반통상(비규격 포함), 일반소포, 등기통상, 등기소포"
                  - list [ref=f272e765]:
                    - listitem [ref=f272e766]: (통상) 6kg 이하, 높이 5cm 이하, (소포) 5호 박스(또는 43*57*38cm), 30kg 이하
                    - listitem [ref=f272e767]: "부가서비스 : 익일특급, 배달증명"
                - listitem [ref=f272e768]:
                  - text: "배달 : 등기통상, 등기소포, 일반소포"
                  - list [ref=f272e769]:
                    - listitem [ref=f272e770]: 착불배달우편물은 요금수납 확인후 배달
                    - listitem [ref=f272e771]: "제외 서비스 : 계약등기통상(회신우편), 본인배달지정), 보험취급, 특별송달 등 배달제한 우편물(고시 제2013-9호)"
                - listitem [ref=f272e772]: "이용시간 : 연중 무휴, 07 :00 ~ 23 :30"
                - listitem [ref=f272e773]: "결제수단 : 카드, 교통카드, 현금(천원권 및 동전)"
