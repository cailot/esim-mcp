                - img "인천공항픽업" [ref=f182e67]
                - text: 2. 유심수령방법은 신청후, 저희가 트래킹번호를 알려드리는데, 트래킹번호를 말하면 택배를 바로 받으실수있습니다. <인천공항픽업위치>
