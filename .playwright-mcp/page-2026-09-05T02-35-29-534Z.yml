                - generic [ref=f225e162]:
                  - paragraph [ref=f225e163]: "[데이터 제공 안내] 1. 기본 제공량 초과 시 Qos 속도제어 되어 기본 제공되며, 별도 요금은 부과되지 않습니다. (Qos속도는 사용환경, 디바이스 등에 따라 달라질 수 있습니다.) 2. 데이터 테더링은 요금제별 제공되는 월 제공량 내에서 사용 가능하며 소진 시 차단됩니다. - 월 제공량 15GB(기본 제공량에서 차감) 3. 데이터 제공량 차감 순서는 기본 제공량 → Qos(최대 Mbps 속도로 무제한) 순으로 차감됩니다. 4. mVoIP은 요금제별 기본 제공 데이터 통화 제공량 내에서 이용 가능하며 소진 시 차단됩니다. [음성 제공 안내] 1. 음성 기본 제공량은 300분입니다. (음성통화는 1초당 1초 차감, 영상통화는 1초당 1.66초 차감) 2. 스팸, 상업적 용도 사용, 불법 사용을 방지하기 위해 아래의 기준을 초과할 경우 정상요금 부과, 이용정지 등 서비스를 제한할 수 있습니다. 1) 음성통화량이 일 600분을 초과하는 횟수가 월 중 3회가 넘는 경우(영상통화는 음성의 1.66배로 계산함) 2) 월 6,000분을 초과할 경우(영상통화는 음성의 1.66배로 계산함) 3) 수신처가 월 1,000회선(합산)을 초과할 경우 [문자 제공 안내] 1. 문자 기본 제공량은 300건입니다. 2. 문자는 SMS, LMS, MMS 구분 없이 사용이 가능합니다. 3. 문자 메시지를 광고성 스팸 메시지 발송과 같이 상업적 목적으로 이용하거나, 물리적 장치 또는 자동 발송 프로그램을 이용하는 경우 또는 1) 메시지 사용 건수가 일 500건을 초과하는 경우 2) 메시지 사용 건수가 일 150건을 초과하는 회수가 월 10회를 초과하는 경우 3) 메시지 수신처가 월 2,000회선을 초과하는 경우 상업적이거나 불편법적인 이용으로 간주되어 이용정지, 해지, 정상요금 부과, 타 요금제 변경 등의 조치를 취할 수 있습니다."
