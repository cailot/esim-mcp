              - region "상품 소개" [ref=f219e157]:
                - generic [ref=f219e158]:
                  - paragraph [ref=f219e159]: "[유의사항] 1. 기본료(기간할인금액, 평생할인금액 등)와 제공 사은품은 개통시점 기준으로 적용됩니다. 2. 정보이용료(소액결제 등)는 데이터 요금과 별도로 부과됩니다. 3. 중도가입/해지시 기본량과 청구 금액은 일할 계산되어 적용됩니다. 4. 최소 유지기간이 있으며, 최소 유지기간 내 해지시 할인반환금이 발생합니다. 1) 최소 유지기간 : 개통일 포함 93일 2) 할인반환금 산정 방식 : 유지 기간 내 할인 받은 총 금액 3) 할인반환금은 타사로 번호이동 시 전 통신사 이용요금에 포함되지 않으며, 해지 익월 별도 청구되어 확인 가능합니다. 5. 요금할인은 일할 적용됩니다. 6. 택배수령 유심의 경우 개통 조건으로 무료 제공되며, 미개통 및 단순 변심으로 인한 취소 시 비용이 발생됩니다. 7. 기존 아시아모바일 고객님의 요금제 변경 시에는 프로모션(요금할인)이 적용되지 않은 금액으로 변경 됩니다. [데이터 제공 안내] 1. 기본 데이터 제공량 6GB입니다. 2. 데이터 테더링은 요금제별 제공되는 월 제공량 내에서 사용 가능하며 소진 시 차단됩니다. - 월 제공량 6GB(기본 제공량에서 차감) 3. mVoIP은 요금제별 기본 제공 데이터 통화 제공량 내에서 이용 가능하며 소진 시 차단됩니다. [음성 제공 안내] 1. 음성 기본 제공량은 300분입니다. (음성통화는 1초당 1초 차감, 영상통화는 1초당 1.66초 차감) 2. 스팸, 상업적 용도 사용, 불법 사용을 방지하기 위해 아래의 기준을 초과할 경우 정상요금 부과, 이용정지 등 서비스를 제한할 수 있습니다. 1) 음성통화량이 일 600분을 초과하는 횟수가 월 중 3회가 넘는 경우(영상통화는 음성의 1.66배로 계산함) 2) 월 6,000분을 초과할 경우(영상통화는 음성의 1.66배로 계산함) 3) 수신처가 월 1,000회선(합산)을 초과할 경우 [문자 제공 안내] 1. 문자 기본 제공량은 50건입니다. 2. 문자는 SMS, LMS, MMS 구분 없이 사용이 가능합니다. 3. 문자 메시지를 광고성 스팸 메시지 발송과 같이 상업적 목적으로 이용하거나, 물리적 장치 또는 자동 발송 프로그램을 이용하는 경우 또는 1) 메시지 사용 건수가 일 500건을 초과하는 경우 2) 메시지 사용 건수가 일 150건을 초과하는 회수가 월 10회를 초과하는 경우 3) 메시지 수신처가 월 2,000회선을 초과하는 경우 상업적이거나 불편법적인 이용으로 간주되어 이용정지, 해지, 정상요금 부과, 타 요금제 변경 등의 조치를 취할 수 있습니다."
                  - img "아시아 300분/6GB" [ref=f219e160]
