                - paragraph [ref=f239e170]: "[올리브영 상품권 3천원 증정] - 사은품 이벤트는 당사 사정에 따라 조기종료 및 변경될 수 있습니다. - 상품 증정 대상 요금제 가입은 명의당 최대 2회선으로 제한됩니다. - 요금제별 할인 기간에 따라 상품권 증정 대상이 다라지오니 확인하시기 바랍니다. - 지급일의 경우 익월말 지급(9월 가입 시 > 26년 10월 말부터 27년 9월말까지 12개월 간 지급, 영업일 기준) - 알뜰폰 허브 사이트로 가입 신청 시 유심비는 월 청구 금액에 포함되어 후청구 됩니다. (유심비는 1회) [테더링(핫스팟) 이용 안내] * 해당 요금제의 테더링(핫스팟) 이용 한도는 월 기본제공량 내에서 이용 가능 합니다. [가입 관련 안내] 1. 해당 요금제는 당사 사정에 따라 조기 종료될 수 있습니다. 2. 가입 월로부터 M+3개월 내에 음성 15분, 데이터 50MB 미만 사용 회선은 할인 중단 및 직권 해지 될 수 있습니다. 3. 사은품 혜택이 있는 요금제의 경우, 요금제 변경 시에는 혜택 제공이 불가하며 신규가입이나 번호이동 접수 시에 제공됩니다. [데이터 과금안내] - 기본제공된 데이터 초과 이용 시, 0.011원/0.5KB로 종량 과금하되 월 19,800원 이상은 과금하지 않습니다. (단, 초과 이용 데이터량이 3GB를 초과한 경우, 데이터 통신속도를 200Kbps 이하로 제한합니다.) - 3GB를 초과시에도 정상속도로 데이터를 이용하고자 할 경우, 통신속도제어를 해제할 수 있으며, 속도제어 해제시 0.0033원/0.5KB 기준으로 종량과금됩니다. [음성 사용안내] mVoip는 요금제 기본제공량 내에서만 사용가능합니다. - 기본 제공량은 음성 1초당 1초, 영상 1초당 1.66초 기준으로 기본 제공량에서 줄어듭니다. - 기본제공되는 통화 미소진시, 잔여량은 이월되지 않습니다. **부가통화란? 전국 대표번호(15XX, 16XX, 18XX 등), 개인번호서비스(050, 060 등), 0130, 011-200, 011-700, 지역번호+153/141/700 등의 전화번호로 하는 통화 [문자 사용안내] 기본제공량 소진 시에는 기준요율에 따라 과금됩니다. SMS (한글 40자 이하 단문메시지) : 22원/건 LMS (한글 1천자 이하 장문메시지) : 33원/건 MMS 이미지 : 110원/건 MMS 동영상 : 110원/건"
