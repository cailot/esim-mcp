                  - paragraph [ref=f208e78] [cursor=pointer]: 유심을 신청하면 사진과 같은 내용물이 배송되는데, 저는 쇼핑몰에서 유심을 신청했고, 배송신청 다음 날 밤 늦게 받았어요. 아마도 주문된 유심을 한번에 모아서 배송하기 때문에 일반 택배보다는 좀 늦게 배송되는것 같네요. 이 시간이 너무 길어서 기다리기 어렵다면 근처 편의점에서 유심을 바로 구입하실 수 있어요. 만약 휴대폰으로 매일 교통카드 결제를 하셔야 한다면 일반유심 말고 꼭 NFC 유심을 구입하셔야 해요!!! 저는 셀프개통으로 진행했는데 걸린 시간은 5분 내외 였던거 같아요. 본인인증, 요금제선택, 기존통신사 해지 및 기존 발생요금 확인, 요금 자동이체 결제수단 등록, 유모바일 개통대기, 유심교체 및 휴대폰 전원 껐다가 켜기 등의 절차를 하나씩 진행하다 보면 금새 완료되어요. 셀프개통 진행도중 본인 인증시 신분증이 필요하고 본인 명의 신용카드(체크카드는 안되요) 또는 네이버나 카카오나 토스 등에서 제공되는 인증서가 필요해요. 만약 본인 신용카드가 없더라도 네이버나 카카오나 토스 등의 인증서를 활용하면 되기때문에 전혀 걱정하실 필요 없답니다. 개통후 집근처, 회사근처 모두 신호 잘 잡히고, 통화 잘되고, 데이터 연결 및 사용에 아무 문제 없었어요. 제 경우 통화품질이나 데이터 연결에 대한 부족함은 따로 느끼지 못했고 지하철 와이파이 연결도 만족하구요. 혹시 유모바일 이동하실 생각이 있으시면 딱히 통화품질 등으로 걱정하지는 않으셔도 될것 같아요. 이상 내돈내산 후기였습니다. 아직 시간이 좀 남긴 했지만 이 글을 보시는 분들 모두 메리 크리스마스!!! ^^
