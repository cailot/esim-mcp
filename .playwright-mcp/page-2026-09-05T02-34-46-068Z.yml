                - button "상품 소개" [expanded] [ref=f209e165]
              - region "상품 소개" [ref=f209e166]:
                - paragraph [ref=f209e168]: "해당 요금제는 7개월간 할인이 적용되는 기간한정 할인요금제입니다. 할인 적용은 개통일부터 일할 계산 적용됩니다. 할인 종료 후에는 할인 적용 전 기본료가 청구됩니다. 유심은 최초 1회 무료(NFC기능X)택배발송 드리며, NFC유심은 8,800원 하기 계좌로 입금 후 확인 완료 시 택배발송 됩니다. 하나은행 260-910014-00205 예금주 : 고고팩토리 입금하실 때 입금자명 및 휴대폰번호 뒷4자리 입력 해주세요. ex) 홍길동/0070 NFC유심비는 후청구 되지 않으며, 추가납부 부분에 8,800원은 단순 표기용입니다. 가입신청 후 14일이내 개통요청이 없을경우 또는 개통정보 오류로 개통이 불가한 경우 주문건은 자동 취소처리 됩니다. 해당 요금제 가입 시 4개월 간 번호이동 제한 서비스에 가입됩니다. 4개월이 지나면 자동으로 해지돼요. 4개월 이내에 해지하면 할인 반환금이 생길 수 있으니 유의해 주세요. 번호이동 가입 시, 번호이동수수료 800원이 청구됩니다. 신규 가입 시 해당되지 않습니다. 월중 요금제가입/해지/변경시 기본제공량은 일할계산되어 제공됩니다. NFC 유심의 교통카드 기능은 KT향 단말기, 자급제 사용 고객만 가능합니다. 해당 프로모션은 당사 사정에 따라 조기 종료 또는 변경 될 수있습니다. ※ 미성년자 접수시 유의사항 안내 - 미성년자 구비서류(법정대리인 신분증+발급일자 3개월 이내 가족관계 증빙서류 제출 필) / 법정대리인 연락처 함께 기재 부탁드립니다. 증빙 서류를 발급 후 당사 홈페이지 1:1 문의( https://gogomobile.co.kr/board/qna_write/58 )로 접수를 부탁 드립니다. * 가족관계 증빙서류는 아래의 서류일 경우 접수 진행이 불가합니다. 1) 발급일자 3개월 경과 서류 2) 열람용 서류 (법적 효력 없음) 3) PC 모니터 촬영본/휴대폰 캡쳐본/휴대폰 화면 촬영본 서류 (실물 스캔본 혹은 실물 촬영본만 가능합니다.) ※초과요율안내 통화 : 음성 1.98원/초, 영상 3.3원/초 데이터 : 22.55원/MB 문자 : SMS(단문문자) 22원/건, LMS(장문문자) 33원/건, MMS(사진문자) 220원/건"
