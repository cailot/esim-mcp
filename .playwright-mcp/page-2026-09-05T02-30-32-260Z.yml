                  - definition [ref=f169e168]:
                    - paragraph [ref=f169e169]: "- 해당 요금상품은 신규/번호이동 고객만 가입 가능하며, 기존 프리티U+고객은 해당 상품으로 요금변경이 불가 합니다."
                    - paragraph [ref=f169e170]: "- 프리티의 모든 요금제는 위약금이 없는 무약정 요금제 입니다."
                    - paragraph [ref=f169e171]: "- 온라인몰에서만 가입 가능한 전용 요금제이며, 프리티의 모든 요금제 기본료는 부가세가 포함된 금액입니다."
                    - paragraph [ref=f169e172]: "- 프리티의 모든 요금제는 발신번호표시서비스(CID)를 기본으로 제공합니다."
                    - paragraph [ref=f169e173]: "- 통화품질, 부가서비스는 LGU+와 동일합니다."
                    - paragraph [ref=f169e174]: "- 월 중 요금제 가입/해지/변경 시, 기본 제공량 및 기본료는 일할 계산되어 적용됩니다."
                    - paragraph [ref=f169e175]: (기본 제공량은 국내 사용량에만 해당됩니다.)
                    - text: "- 추가 기간할인 혜택이 있는 경우, 할인 혜택 적용은 개통 당일부터 지정기간 동안 할인 적용(일할 계산)됩니다."
                    - paragraph [ref=f169e176]: "- 해외에서 온라인으로 신청하신 고객은 연락 가능한 번호가 없으면 가입 진행이 불가합니다."
                    - paragraph [ref=f169e177]: (현지 전화번호의 국제전화로는 통화불가, 국내 사용 중인 로밍번호로 가능)
                    - paragraph [ref=f169e178]: "- 요금제 변경(원복 포함)/명의변경 시 할인 적용이 중단되며 일시정지 시에도 할인이 중단되나 정지기간은 할인 기간에 포함 됩니다."
              - listitem [ref=f169e179]:
                - generic [ref=f169e180]:
                  - term [ref=f169e181]:
                    - link [ref=f169e182] [cursor=pointer]:
